# ============================================================
# Postgres 16 — 로컬 개발용 커스텀 설정
# pgvector/pgvector:pg16 이미지 기준
# ============================================================

# ---- 접속
listen_addresses = '*'
port = 5432
max_connections = 100

# ---- 인증
password_encryption = scram-sha-256

# ---- 메모리 (로컬 개발 디폴트)
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB

# ---- WAL / Checkpoint
wal_level = replica
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9
wal_compression = on

# ---- 병렬
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2

# ---- pgvector (HNSW) 튜닝
hnsw.ef_search = 40

# ---- pg_trgm
# similarity_threshold 는 세션 단위 SET 권장 (쿼리 마다 튜닝)

# ---- Slow query 로깅 (개발 편의)
log_min_duration_statement = 200
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# ---- PL/pgSQL
plpgsql.print_strict_params = on