services:
  - type: web
    name: api
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SERVICE
        value: api
      - key: PORT
        value: "3000"
      - key: SEARCH_REC_URL
        fromService:
          type: web
          name: search-rec
          property: hostport
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  - type: web
    name: search-rec
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: search-rec
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  - type: worker
    name: ai-gen
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SERVICE
        value: ai-gen
      - key: PORT
        value: "3002"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
