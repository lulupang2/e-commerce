# ============================================================
# Redis 7 — 로컬 개발용 (캐시 + Stream + 분산락)
# ============================================================

# 접속
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 300
timeout 0

# 인증 (컨테이너 내부 통신에도 인증 적용)
# requirepass 는 .env 의 REDIS_PASSWORD 를 docker-compose command 에서 주입
# (여기서 하드코딩 금지)

# 메모리 정책 (캐시 중심 + Stream eviction 회피는 키 prefix 설계로 처리)
maxmemory 256mb
maxmemory-policy allkeys-lru

# AOF (내구성 — Stream 손실 방지 최소 안전망)
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Stream 최적화 (소비자 그룹 기반 이벤트버스 전제)
stream-node-max-bytes 4096
stream-node-max-entries 100

# Lazy free (큰 키 eviction/DEL 비동기화)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# 로깅
loglevel notice

# RDB 보조 (정기 스냅샷 5분 1회)
save 300 10
stop-writes-on-bgsave-error no