# ============================================================
# e커머스 MSA + AI 포트폴리오 — 로컬 개발용 인프라
# WSL2 Rocky9 / Docker Compose
# ============================================================

name: ${COMPOSE_PROJECT_NAME:-portfolio}

services:
  # ----------------------------------------------------------
  # Postgres 16 + pgvector (의미론 검색) + pg_trgm (키워드 폴백)
  # ----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${COMPOSE_PROJECT_NAME:-portfolio}-postgres
    restart: unless-stopped
    ports:
      # WSL2는 Windows 호스트와 포트 공유 → 네이티브 5432 충돌 회피
      - "${PG_HOST_BIND:-127.0.0.1}:${PG_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      # named volume — SELinux 라벨링 이슈 회피
      - pg_data:/var/lib/postgresql/data
      # init 스크립트는 read-only 바인드 (SELinux 안전)
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      # Rocky9 SELinux — 바인드 마운트 read-only와 함께 라벨 강제 비활성
      - label=disable
    networks:
      - infra-net

  # ----------------------------------------------------------
  # Redis 7 — 캐시 + Stream(이벤트버스) + 분산락(Redlock)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-portfolio}-redis
    restart: unless-stopped
    ports:
      # 네이티브 6379 충돌 회피
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_PORT:-16379}:6379"
    environment:
      # healthcheck에서 shell expand용 노출 (비밀값 자체는 .env에서만 정의)
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    security_opt:
      - label=disable
    networks:
      - infra-net

  # ----------------------------------------------------------
  # search-rec — 시맨틱 검색 + 추천 HTTP 서비스 (:3001)
  # ----------------------------------------------------------
  search-rec:
    build:
      context: .
      dockerfile: apps/search-rec/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-portfolio}-search-rec
    restart: unless-stopped
    ports:
      - "${SEARCH_REC_HOST_BIND:-127.0.0.1}:${SEARCH_REC_PORT:-3001}:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    security_opt:
      - label=disable
    networks:
      - infra-net

  # ----------------------------------------------------------
  # ai-gen — Redis Stream consumer + 가드레일 (:3002 /health)
  # ----------------------------------------------------------
  ai-gen:
    build:
      context: .
      dockerfile: apps/ai-gen/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-portfolio}-ai-gen
    restart: unless-stopped
    ports:
      - "${AI_GEN_HOST_BIND:-127.0.0.1}:${AI_GEN_PORT:-3002}:3002"
    environment:
      PORT: "3002"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GEN_BASE_URL: ${GEN_BASE_URL:-}
      GEN_API_KEY: ${GEN_API_KEY:-}
      GEN_MODEL: ${GEN_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    security_opt:
      - label=disable
    networks:
      - infra-net

  # ----------------------------------------------------------
  # api — BFF 게이트웨이 (:3000) — search-rec 를 서비스명으로 호출
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-portfolio}-api
    restart: unless-stopped
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      SEARCH_REC_URL: http://search-rec:3001
    depends_on:
      search-rec:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    security_opt:
      - label=disable
    networks:
      - infra-net

volumes:
  pg_data:
    name: ${COMPOSE_PROJECT_NAME:-portfolio}_pg_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-portfolio}_redis_data

networks:
  infra-net:
    name: ${COMPOSE_PROJECT_NAME:-portfolio}_net
    driver: bridge