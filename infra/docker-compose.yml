# e커머스 MSA+AI 포트폴리오 — 로컬 개발 인프라 (Postgres+pgvector / Redis)

name: ${COMPOSE_PROJECT_NAME:-portfolio}

services:
  # ---- Postgres 16 + pgvector(의미론 검색) + pg_trgm(키워드 폴백)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${COMPOSE_PROJECT_NAME:-portfolio}-postgres
    restart: unless-stopped
    ports:
      - "${PG_HOST_BIND:-127.0.0.1}:${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      - label=disable
    networks:
      - infra-net

  # ---- Redis 7 — 캐시 + Stream(이벤트버스) + 분산락(Redlock)
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-portfolio}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    security_opt:
      - label=disable
    networks:
      - infra-net

volumes:
  pg_data:
    name: ${COMPOSE_PROJECT_NAME:-portfolio}_pg_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-portfolio}_redis_data

networks:
  infra-net:
    name: ${COMPOSE_PROJECT_NAME:-portfolio}_net
    driver: bridge
